name: Auto Assign PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Assign PR to LeGitHubDeTai
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --add-assignee "LeGitHubDeTai"
