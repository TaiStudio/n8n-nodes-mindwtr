version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "LeGitHubDeTai"
    reviewers:
      - "LeGitHubDeTai"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "LeGitHubDeTai"
    reviewers:
      - "LeGitHubDeTai"
